
<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Categoria - BiblioTec</title>
    <link rel="stylesheet" th:href="@{/css/categorias.css}">
</head>
<body>

<h1 th:text="${categoria.id == null ? 'Cadastro de Categoria' : 'Editar Categoria'}">
    Cadastro de Categoria
</h1>

<form th:action="@{/categorias}" th:object="${categoria}" method="post">

    <input type="hidden" th:field="*{id}">

    <label for="nome">Nome:</label>
    <input type="text" id="nome" th:field="*{nome}" required>

    <br><br>

    <label for="descricao">Descrição:</label>
    <textarea id="descricao" th:field="*{descricao}"></textarea>

    <br><br>

    <button type="submit">Salvar</button>
    <a th:href="@{/categorias}">Cancelar</a>

</form>

</body>
</html>
