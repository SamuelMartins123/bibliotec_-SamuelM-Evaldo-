<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Cadastro de Livro - BiblioTec</title>
    <link rel="stylesheet" th:href="@{/css/categorias.css}">
</head>
<body>

<div class="container">

    <h1 th:text="${livro.id == null ? 'Cadastrar livro' : 'Editar livro'}">
        Cadastrar livro
    </h1>

    <form th:action="@{/livros}"
          th:object="${livro}"
          method="post">

        <!-- ID escondido: identifica se é cadastro ou edição -->
        <input type="hidden" th:field="*{id}">


        <!-- Título -->
        <label for="titulo">Título:</label>
        <input type="text"
               id="titulo"
               th:field="*{titulo}"
               th:errorclass="campo-erro">

        <p th:if="${#fields.hasErrors('titulo')}"
           th:errors="*{titulo}">
        </p>


        <!-- Autor -->
        <label for="autor">Autor:</label>
        <input type="text"
               id="autor"
               th:field="*{autor}"
               th:errorclass="campo-erro">

        <p th:if="${#fields.hasErrors('autor')}"
           th:errors="*{autor}">
        </p>


        <!-- ISBN -->
        <label for="isbn">ISBN (13 números):</label>
        <input type="text"
               id="isbn"
               th:field="*{isbn}"
               maxlength="13"
               th:errorclass="campo-erro">

        <p th:if="${#fields.hasErrors('isbn')}"
           th:errors="*{isbn}">
        </p>


        <!-- Ano de publicação -->
        <label for="anoPublicacao">Ano de publicação:</label>
        <input type="number"
               id="anoPublicacao"
               th:field="*{anoPublicacao}"
               th:errorclass="campo-erro">

        <p th:if="${#fields.hasErrors('anoPublicacao')}"
           th:errors="*{anoPublicacao}">
        </p>


        <!-- Quantidade total -->
        <label for="quantidadeTotal">Quantidade total:</label>
        <input type="number"
               id="quantidadeTotal"
               th:field="*{quantidadeTotal}"
               min="1"
               th:errorclass="campo-erro">

        <p th:if="${#fields.hasErrors('quantidadeTotal')}"
           th:errors="*{quantidadeTotal}">
        </p>


        <!-- Categoria -->
        <label for="categoria">Categoria:</label>

        <select id="categoria"
                th:field="*{categoria.id}"
                th:errorclass="campo-erro">

            <option value="">Selecione uma categoria</option>

            <option th:each="c : ${categorias}"
                    th:value="${c.id}"
                    th:text="${c.nome}">
            </option>

        </select>

        <p th:if="${#fields.hasErrors('categoria.id')}"
           th:errors="*{categoria.id}">
        </p>


        <!-- Botões -->
        <button type="submit" class="botao"
                th:text="${livro.id == null ? 'Salvar livro' : 'Atualizar livro'}">
            Salvar livro
        </button>

        <a th:href="@{/livros}" class="botao">
            Cancelar
        </a>

    </form>

</div>

</body>
</html>
